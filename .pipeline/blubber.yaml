# syntax = docker-registry.wikimedia.org/repos/releng/blubber/buildkit:v1.8.0
version: v4
base: docker-registry.wikimedia.org/golang1.24:1.24-20260503
lives:
  in: /srv/service/
runs:
  environment:
    APP_BASE_PATH: /srv/service

variants:
  build:
    apt: { packages: [build-essential] }
    runs: { insecurely: true }
    builder:
      command: [make tegola_cmd]
      requirements: [.]
  development:
    includes: [build]
    entrypoint: [cmd/tegola/tegola]
  test:
    includes: [build]
    entrypoint: [make, test]
  prep:
    includes: [build]
  production:
    base: docker-registry.wikimedia.org/python3-trixie:0.0.1-20260503
    copies: [prep]
    entrypoint: [cmd/tegola/tegola]
    apt: { packages: [build-essential, python3-dev, jq, wmf-certificates, curl, libsnappy-dev, git] }
    python:
      requirements: ["requirements.txt"]
      version: python3
